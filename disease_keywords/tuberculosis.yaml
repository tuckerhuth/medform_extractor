metadata:
  description: Pattern matching definitions for tuberculosis testing, updated to handle 1-step skin test, 2-step skin test, blood test, and X-ray
  structure: condition → test_method → detection_aspect → pattern_type → patterns
  test_methods:
    skin_test_1_step: Single tuberculin skin test (1-step)
    skin_test_2_step: Baseline two-step tuberculin skin test
    blood_test: Blood-based tests (IGRA, QuantiFERON, T-SPOT)
    radiography: Chest imaging examinations (X-ray, CT)
  detection_aspects:
    test_name: References to the test itself
    procedure: How the test is performed
    administration: When and how the test is given
    results_documentation: Recording and interpretation of test results
  pattern_types:
    keywords: Exact match terms
    regex_patterns: Regular expression patterns for flexible matching
  confidence_scores:
    description: Confidence levels (0-1) representing reliability of pattern matches
    ranges:
      0.95+: Very high confidence
      0.90-0.94: High confidence
      0.80-0.89: Medium confidence
      0.70-0.79: Lower confidence

tuberculosis:

  skin_test_1_step:
    test_name:
      keywords:
        - string: 1-step tb test
          confidence: 0.95
        - string: one-step tb test
          confidence: 0.95
        - string: single-step tb test
          confidence: 0.90
        - string: single tb skin test
          confidence: 0.90
        - string: annual tb skin test
          confidence: 0.85
        - string: routine tb skin test
          confidence: 0.85
        # Also keep generic references to TST/PPD, but under this category if there's no mention of “2-step”:
        - string: tb skin test
          confidence: 0.80
        - string: ppd skin test
          confidence: 0.80
        - string: purified protein derivative
          confidence: 0.80
        - string: mantoux
          confidence: 0.80
      regex_patterns:
        # One-step references with numeric mention:
        - string: \b1[\s-]?step\s+(?:tb\s+skin\s+test|tst|ppd)
          confidence: 0.95
        - string: \bone[\s-]?step\s+(?:tb\s+test|skin\s+test|mantoux|ppd|tst)
          confidence: 0.95
        # If “two-step” is not present:
        - string: \b(?:tb\s+skin\s+test|ppd|tst)\b(?!.*\btwo\s?-step\b)
          confidence: 0.85
    procedure:
      keywords:
        - string: single tuberculin injection
          confidence: 0.90
        - string: one-step tst procedure
          confidence: 0.90
        - string: standard ppd procedure
          confidence: 0.85
      regex_patterns:
        # Searching for a single test with 48-72 hour mention, but no second test mention
        - string: \bplaced\s+(?:once|single)(?:.*\b48-72\s*hours\b)
          confidence: 0.90
    administration:
      keywords:
        - string: one-step tst administered
          confidence: 0.90
        - string: single tst placed
          confidence: 0.90
        - string: annual ppd placed
          confidence: 0.85
      regex_patterns:
        - string: \badministered\s+a\s+single[\s-]step\s+tst
          confidence: 0.95
        - string: \b(ppd|tst)\s+placed\b(?!.*\b(second|2nd|two-step)\b)
          confidence: 0.90
    results_documentation:
      keywords:
        - string: one-step test reading
          confidence: 0.90
        - string: single step tb reading
          confidence: 0.85
      regex_patterns:
        - string: \bone[\s-]?step\s+(?:ppd|tst)\s+result\s+(?:negative|positive|indeterminate)
          confidence: 0.95
        # This excludes mention of step 2
        - string: \b(?:read|interpreted)\s+a\s+single[\s-]?step\s+(?:ppd|tst|skin\s+test)
          confidence: 0.90


  skin_test_2_step:
    test_name:
      keywords:
        - string: 2-step tb test
          confidence: 0.95
        - string: two-step tb test
          confidence: 0.95
        - string: 2-step skin test
          confidence: 0.95
        - string: two-step tst
          confidence: 0.95
        - string: baseline two-step tb
          confidence: 0.90
        - string: double mantoux
          confidence: 0.90
      regex_patterns:
        - string: \b2[\s-]?step\s+(?:tb\s+skin\s+test|tst|ppd|mantoux)
          confidence: 0.95
        - string: \btwo[\s-]?step\s+(?:tb\s+test|tst|ppd|skin\s+test)
          confidence: 0.95
        # Searching for step1, step2 references
        - string: \bstep\s+1\s+of\s+2\b.*\bstep\s+2\s+of\s+2\b
          confidence: 0.95
    procedure:
      keywords:
        - string: two-step tuberculin protocol
          confidence: 0.90
        - string: baseline two-step procedure
          confidence: 0.90
      regex_patterns:
        - string: \bfirst\s+tst\b.*\bsecond\s+tst\b.*\b(1-3\s+weeks|7-21\s+days)\s+later
          confidence: 0.95
    administration:
      keywords:
        - string: two-step testing performed
          confidence: 0.90
        - string: step 1 and step 2 placed
          confidence: 0.90
        - string: second ppd placed
          confidence: 0.85
      regex_patterns:
        # Indicate first test is negative, second test placed
        - string: \bfirst\s+(?:tst|ppd)\s+(?:negative|pos|neg).*?\bsecond\s+(?:tst|ppd)\s+(?:placed|administered)
          confidence: 0.95
        # Indicate baseline 2-step
        - string: \bbaseline\s+(?:two|2)[\s-]step\s+(?:test|tst|ppd)
          confidence: 0.95
    results_documentation:
      keywords:
        - string: two-step results completed
          confidence: 0.90
        - string: step 1 negative, step 2 negative
          confidence: 0.95
      regex_patterns:
        - string: \b(two[\s-]?step|2[\s-]?step)\s+(?:test|tst|ppd)\s+(?:results|reading)\s+(?:negative|positive)
          confidence: 0.95
        - string: \b(step\s+1\s+(?:result|reading).*?step\s+2\s+(?:result|reading))
          confidence: 0.90


  blood_test:
    # Largely unchanged. Retaining existing sets for IGRA, QuantiFERON, T-SPOT, etc.
    test_name:
      keywords:
        - string: interferon gamma release assay
          confidence: 0.95
        - string: quantiferon tb gold
          confidence: 0.95
        - string: quantiferon tb gold plus
          confidence: 0.95
        - string: t-spot tb test
          confidence: 0.95
        # ...
      regex_patterns:
        # ...
    procedure:
      keywords:
        # ...
      regex_patterns:
        # ...
    administration:
      keywords:
        # ...
      regex_patterns:
        # ...
    results_documentation:
      keywords:
        # ...
      regex_patterns:
        # ...

  radiography:
    # Keep the structure for X-ray, but add some negative context to avoid “maybe” or “might” matches.
    test_name:
      keywords:
        - string: chest x-ray
          confidence: 0.95
        - string: chest radiograph
          confidence: 0.95
        - string: chest ct
          confidence: 0.80
        # ...
      regex_patterns:
        - string: \bcxr\b(?!\s+not\s+performed)
          confidence: 0.90
        - string: \bchest[\s-]*(?:x[\s-]*ray|ct)
          confidence: 0.90
        # ...
    procedure:
      keywords:
        - string: chest imaging
          confidence: 0.90
        # ...
      regex_patterns:
        - string: (?:chest|thoracic)[\s-]*imaging
          confidence: 0.90
        # ...
    administration:
      keywords:
        - string: chest x-ray completed
          confidence: 0.95
        - string: cxr obtained
          confidence: 0.95
        # ...
      regex_patterns:
        # Negative lookahead for “may|might|if needed”
        - string: \b(?:chest\s+x-ray|cxr)\s+(?:was|were)\s+(?:done|performed|obtained)(?!.*\bmay\b|\bmight\b|\bif\b|\bplanned\b)
          confidence: 0.95
        # ...
    results_documentation:
      keywords:
        - string: chest x-ray findings
          confidence: 0.95
        # ...
      regex_patterns:
        - string: \bchest[\s-]*x[\s-]*ray\s+(?:findings|reviewed|interpretation|report)
          confidence: 0.95
        # ...
