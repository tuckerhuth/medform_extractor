metadata:
  description: Pattern matching definitions for tuberculosis testing
  structure: condition → test_method → detection_aspect → pattern_type → patterns
  test_methods:
    skin_test: Tuberculin skin tests (TST, PPD, Mantoux)
    blood_test: Blood-based tests (IGRA, QuantiFERON, T-SPOT)
    radiography: Chest imaging examinations (X-ray, CT)
  detection_aspects:
    test_name: References to the test itself
    procedure: How the test is performed
    administration: When and how the test is given
    results_documentation: Recording and interpretation of test results
  pattern_types:
    keywords: Exact match terms
    regex_patterns: Regular expression patterns for flexible matching
  confidence_scores:
    description: Confidence levels (0-100) representing reliability of pattern matches
    ranges:
      95+: Very high confidence
      90-94: High confidence
      80-89: Medium confidence
      70-79: Lower confidence

